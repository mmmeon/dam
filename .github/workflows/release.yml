name: Release

# v* tags publish a versioned release. Once a day, main replaces the rolling
# "nightly" pre-release, which never becomes the repo's latest release.
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '0 6 * * *'  # skipped when main hasn't changed since the last nightly
  workflow_dispatch:  # build a nightly from main now, even if unchanged

permissions:
  contents: write
  id-token: write  # Sigstore signing certificate for the attestation
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  NAME: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}

jobs:
  changed:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(gh api "repos/$GITHUB_REPOSITORY/commits/nightly" -q .sha 2>/dev/null) || built=
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$built" != "$GITHUB_SHA" ]; then
            echo build=true >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: changed
    # changed is skipped for tags, so don't let that skip this job.
    if: ${{ !cancelled() && !failure() && (github.ref_type == 'tag' || needs.changed.outputs.build == 'true') }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Stamp Commit sets CFBundleVersion from the commit count

      - name: Test
        run: |
          xcodebuild -project DAM.xcodeproj -scheme DAM \
            -destination 'platform=macOS' \
            -derivedDataPath build/dd \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= \
            test

      - name: Build (Release, ad-hoc signed, arm64 + x86_64)
        run: |
          # Nightlies keep the project's MARKETING_VERSION.
          version=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=(MARKETING_VERSION="${GITHUB_REF_NAME#v}")
          fi
          xcodebuild -project DAM.xcodeproj -scheme DAM \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/dd \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= \
            "${version[@]}" \
            build

      - name: Package
        run: |
          mkdir -p dist stage
          ditto build/dd/Build/Products/Release/DAM.app stage/DAM.app
          ln -s /Applications stage/Applications
          hdiutil create -volname DAM -srcfolder stage -format UDZO -ov \
            "dist/DAM-${NAME}.dmg"
          (cd dist && shasum -a 256 *.dmg > SHA256SUMS)

      - name: Build and package Debug (nightly only)
        if: github.ref_type == 'branch'
        run: |
          xcodebuild -project DAM.xcodeproj -scheme DAM \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/dd-debug \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= \
            build
          mkdir -p stage-debug
          ditto build/dd-debug/Build/Products/Debug/DAM.app stage-debug/DAM.app
          ln -s /Applications stage-debug/Applications
          hdiutil create -volname DAM -srcfolder stage-debug -format UDZO -ov \
            "dist/DAM-${NAME}-debug.dmg"
          (cd dist && shasum -a 256 *.dmg > SHA256SUMS)

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/DAM-*.dmg

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$NAME" dist/* \
            --title "DAM ${NAME}" \
            --generate-notes

      - name: Publish nightly pre-release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* \
            --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title "DAM nightly" \
            --notes "built from ${GITHUB_SHA::7}."
