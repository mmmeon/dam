name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write  # Sigstore signing certificate for the attestation
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Stamp Commit sets CFBundleVersion from the commit count

      - name: Test
        run: |
          xcodebuild -project DAM.xcodeproj -scheme DAM \
            -destination 'platform=macOS' \
            -derivedDataPath build/dd \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= \
            test

      - name: Build (Release, ad-hoc signed, arm64 + x86_64)
        run: |
          xcodebuild -project DAM.xcodeproj -scheme DAM \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/dd \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" \
            build

      - name: Package
        run: |
          mkdir -p dist stage
          ditto build/dd/Build/Products/Release/DAM.app stage/DAM.app
          ln -s /Applications stage/Applications
          hdiutil create -volname DAM -srcfolder stage -format UDZO -ov \
            "dist/DAM-${GITHUB_REF_NAME}.dmg"
          (cd dist && shasum -a 256 *.dmg > SHA256SUMS)

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/DAM-*.dmg

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "DAM ${GITHUB_REF_NAME}" \
            --generate-notes
